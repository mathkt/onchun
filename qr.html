<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부스 대기 화면 · 부산의 활동수학</title>
<link rel="stylesheet" href="common.css">
<style>
  html,body{height:100%}
  body.bk{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.5vh,26px);
    padding:20px;box-sizing:border-box;cursor:none;background:var(--bk-cream-2) url("img/ch02.jpg") center 30%/cover no-repeat;position:relative;overflow:hidden}
  body.bk::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(251,240,200,.95),rgba(251,240,200,.9));z-index:0}
  .w{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vh,26px);text-align:center;width:100%}
  .eyebrow{display:inline-flex;gap:8px;background:#fff;border:2px solid var(--bk-orange);border-radius:999px;padding:8px 20px;font-family:var(--f-head);color:var(--bk-orange-deep);font-size:clamp(1rem,2.4vw,1.4rem)}
  h1{font-family:var(--f-head);font-size:clamp(2rem,6vw,4.2rem);line-height:1.15;margin:0;color:var(--bk-ink)}
  h1 em{font-style:normal;color:var(--bk-orange-deep);background:linear-gradient(transparent 60%,#fff 60%);padding:0 6px}
  .qr{background:#fff;border-radius:28px;padding:clamp(14px,2.5vh,26px);box-shadow:var(--bk-shadow);border:4px solid var(--bk-orange)}
  .qr svg{width:min(52vh,70vw,420px);height:auto;display:block}
  .url{font-family:var(--f-head);font-size:clamp(1.1rem,3vw,2rem);color:#2f8dbf;background:#fff;padding:8px 22px;border-radius:999px;border:2px solid var(--bk-sky)}
  .steps{display:flex;gap:clamp(10px,2vw,24px);flex-wrap:wrap;justify-content:center}
  .step{background:#fff;border-radius:18px;padding:12px 18px;box-shadow:var(--bk-shadow);font-family:var(--f-head);font-size:clamp(.95rem,2vw,1.3rem);display:flex;align-items:center;gap:10px}
  .step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--bk-sky);color:#fff}
  .games{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(.9rem,1.8vw,1.1rem);color:var(--bk-ink-soft)}
  .games span{background:#fff;border-radius:999px;padding:5px 14px;border:1.5px solid var(--bk-line)}
  .foot{position:fixed;bottom:10px;right:14px;font-size:.75rem;color:var(--bk-ink-soft);z-index:1;opacity:.7}
  @media(max-height:600px){.steps,.games{display:none}}
</style>
</head>
