<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>책 목차 · 부산의 활동수학</title>
<link rel="stylesheet" href="../common.css">
<style>
  .unit{margin:14px 0 24px;border-radius:24px;background:#fff;box-shadow:var(--bk-shadow);overflow:hidden}
  .unit__head{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--bk-cream);cursor:pointer;user-select:none}
  .unit__head .bk-top__num{min-width:44px;height:44px;font-size:1.3rem}
  .unit__head h3{font-family:var(--f-head);font-size:1.5rem;margin:0;flex:1}
  .unit__head .arrow{transition:transform .2s;font-size:1.2rem;color:var(--bk-orange-deep)}
  .unit.open .unit__head .arrow{transform:rotate(180deg)}
  .unit__body{display:none;padding:10px 16px 18px}
  .unit.open .unit__body{display:block}
  .chap{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:14px 6px;border-bottom:1px dashed var(--bk-line)}
  .chap:last-child{border-bottom:0}
  .chap__pic{border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--bk-cream);display:grid;place-items:center;font-size:2.2rem}
  .chap__pic img{width:100%;height:100%;object-fit:cover}
  .chap__t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .chap__t b{font-family:var(--f-head);font-size:1.25rem;font-weight:400}
  .chap__place{font-size:.8rem;color:var(--bk-ink-soft)}
  .acts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .act{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bk-cream-2);font-size:.95rem}
  .act__n{width:26px;height:26px;border-radius:50%;background:var(--bk-sky);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-size:.85rem;flex:none}
  .act__t{flex:1}
  .act .bk-btn{min-height:36px;padding:4px 12px;font-size:.9rem}
  .act--book{opacity:.8}
  .act--book .act__n{background:#c9c3b0}
  .soon{font-size:.75rem;color:#9c8a55;background:#fff3c4;border:1px solid #f1dd8f;padding:3px 9px;border-radius:999px;white-space:nowrap}
  @media(max-width:600px){.chap{grid-template-columns:90px 1fr}}

  .toc-intro{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
  .toc-intro h2{font-family:var(--f-head);font-size:1.5rem;margin:0;flex:1}
  .unit__head{scroll-margin-top:70px}
  footer{margin:40px 0 0;text-align:center;color:var(--bk-ink-soft);font-size:.85rem}
</style>
</head>
<body class="bk">
<script src="../common.js" data-num="📖" data-name="책 목차" data-sub="부산의 활동수학" data-home="../"></script>

const host = document.getElementById('units');
const openUnit = (location.hash.match(/^#u(\d)/)||[])[1];
UNITS.forEach((u, ui) => {
  const el = document.createElement('section');
  el.id = 'u' + u.n;
  el.className = 'unit' + ((openUnit ? openUnit === u.n : ui === 0) ? ' open' : '');
  el.innerHTML = `
    <div class="unit__head"><span class="bk-top__num">${u.n}단원</span><h3>${u.t}</h3><span class="arrow">▼</span></div>
    <div class="unit__body">${u.chapters.map(c => `
      <div class="chap" id="c${c.n}">
        <div class="chap__pic">${c.pic ? `<img src="${R(c.pic)}" alt="">` : (c.emoji || '📘')}</div>
        <div>
          <div class="chap__t"><span class="bk-top__num">${c.n}</span><b>${c.t}</b><span class="chap__place">📍 ${c.place}</span>${c.page ? `<a class="bk-btn bk-btn--sky bk-btn--sm" href="${R(c.page)}">이 장 열기 ▶</a>` : ''}</div>
          <div class="acts">${c.acts.map((a, i) => `
            <div class="act ${a.web ? '' : 'act--book'}">
              <span class="act__n">${i + 1}</span><span class="act__t">${a.t}</span>
              ${a.web ? `<a class="bk-btn bk-btn--mint" href="${R(a.web)}">웹으로 하기 ▶</a>` : a.soon ? `<span class="soon">웹 준비 중</span>` : `<span class="soon" style="background:#f3f0e6;border-color:#e0d9c4;color:#8a8370">책으로</span>`}

            </div>`).join('')}</div>
        </div>
      </div>`).join('')}</div>`;
  el.querySelector('.unit__head').addEventListener('click', () => el.classList.toggle('open'));
  host.appendChild(el);
});
if (openUnit) document.getElementById('u'+openUnit)?.scrollIntoView();
