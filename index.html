<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>부산의 활동수학 · 수학 축전</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ===== 첫 화면: 스크롤 없이 한 화면 ===== */
  html,body{height:100%}
  body{word-break:keep-all;overflow-wrap:anywhere}
  body.bk{margin:0;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--bk-cream-2) url("img/ch02.jpg") center 30%/cover no-repeat}
  body.bk::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(251,240,200,.94) 0%,rgba(251,240,200,.86) 45%,rgba(251,240,200,.96) 100%);z-index:0}
  .home{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3vh,30px);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:1000px;margin:0 auto;width:100%;box-sizing:border-box}
  .home__eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--bk-orange);border-radius:999px;padding:6px 16px;font-family:var(--f-head);color:var(--bk-orange-deep);font-size:clamp(.9rem,2.4vw,1.1rem)}
  .home h1{font-family:var(--f-head);font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.15;margin:0;text-align:center;color:var(--bk-ink)}
  .home h1 em{font-style:normal;color:var(--bk-orange-deep);background:linear-gradient(transparent 60%,#fff 60%);padding:0 4px}
  .home p{font-family:var(--f-serif);font-size:clamp(.95rem,2.5vw,1.1rem);color:var(--bk-ink-soft);margin:0;text-align:center;max-width:40ch}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,26px);width:100%;max-width:820px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--bk-ink);
    background:#fff;border-radius:28px;box-shadow:0 8px 0 #e3d9b5,var(--bk-shadow);padding:clamp(18px,4vh,36px) 18px;
    min-height:clamp(180px,32vh,300px);border:3px solid transparent;transition:transform .12s;-webkit-tap-highlight-color:transparent}
  .tile:active{transform:translateY(5px);box-shadow:0 3px 0 #e3d9b5}
  .tile__icon{font-size:clamp(3rem,9vw,5.2rem);line-height:1}
  .tile__t{font-family:var(--f-head);font-size:clamp(1.4rem,4.2vw,2.2rem)}
  .tile__d{font-size:clamp(.82rem,2.2vw,1rem);color:var(--bk-ink-soft);text-align:center;margin:0}
  .tile--game{border-color:var(--bk-orange)}
  .tile--game .tile__t{color:var(--bk-orange-deep)}
  .tile--book{border-color:var(--bk-sky)}
  .tile--book .tile__t{color:#2f8dbf}

  .home footer{font-size:.78rem;color:var(--bk-ink-soft);text-align:center}
  /* 폰 세로: 위아래로 */
  @media(max-width:560px){
    .tiles{grid-template-columns:1fr}
    .tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:0;padding:18px 20px;gap:16px}
    .tile__icon{font-size:2.8rem}
    .tile__d{text-align:left}
    .home > p,.tile__d:not(.tile__d--games){display:none}
    .tile{padding:16px 14px;gap:12px}.tile>div{min-width:0}
    .home .tile__d--games{font-size:clamp(.62rem,3.6vw,.85rem);white-space:nowrap;letter-spacing:-.3px}
  }
  /* 낮은 화면(크롬북 가로 등) */
  @media(max-height:560px){
    .home{gap:10px}.home > p{display:none}.tile{min-height:150px;gap:6px}.tile__icon{font-size:2.6rem}
  }
</style>
</head>
<body class="bk">
<main class="home">
  <span class="home__eyebrow">🎪 수학 축전 · <span id="school">온천중학교</span> 부스</span>
  <h1>책 속 게임을 <em>직접 해 보는</em><br>부산의 활동수학</h1>
  <p>『부산의 활동수학』의 놀이와 필승 전략 게임을 웹으로 옮겼어요.</p>

  <div class="tiles">
    <a class="tile tile--game" href="games/arcade/index.html">
      <span class="tile__icon">🎮</span>
      <div>
        <div class="tile__t">메인 게임하기</div>
        <p class="tile__d tile__d--games">노탁토 · 돌 가져가기 · 황금비 퀸 · 팝잇</p>
        <p class="tile__d">친구와 · 봇과 · 온라인으로</p>
      </div>
    </a>
    <a class="tile tile--book" href="book/index.html">
      <span class="tile__icon">📖</span>
      <div>
        <div class="tile__t">책 목차 보기</div>
        <p class="tile__d">4단원 17장의 활동을<br>웹에서 바로 해 보기</p>
      </div>
    </a>
  </div>

  <footer>부산의 활동수학 × 수학 축전 부스 · <a href="qr.html" style="color:var(--bk-ink-soft)">🖥 부스 대기 화면(QR)</a> · <a href="monty/index.html" style="color:var(--bk-ink-soft)">🚪 몬티홀 상황판</a></footer>
</main>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
