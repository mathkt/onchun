<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>부산의 활동수학 · 수학 축전</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" data-bkfont="1" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Batang:wght@400;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" media="print" onload="this.media='all'">
<style>
  /* ===== 첫 화면: 스크롤 없이 한 화면 ===== */
  html,body{height:100%}
  body{word-break:keep-all;overflow-wrap:anywhere}
  body.bk{margin:0;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;
    background:var(--bk-cream-2) url("img/home-bg.jpg") center 30%/cover no-repeat}
  body.bk::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(251,240,200,.94) 0%,rgba(251,240,200,.86) 45%,rgba(251,240,200,.96) 100%);z-index:0}
  .home{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3vh,30px);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:1000px;margin:0 auto;width:100%;box-sizing:border-box}
  .home__eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--bk-orange);border-radius:999px;padding:6px 16px;font-family:var(--f-head);color:var(--bk-orange-deep);font-size:clamp(.9rem,2.4vw,1.1rem)}
  .home h1{font-family:var(--f-head);font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.15;margin:0;text-align:center;color:var(--bk-ink)}
  .home h1 em{font-style:normal;color:var(--bk-orange-deep);background:linear-gradient(transparent 60%,#fff 60%);padding:0 4px}
  .home p{font-family:var(--f-serif);font-size:clamp(.95rem,2.5vw,1.1rem);color:var(--bk-ink-soft);margin:0;text-align:center;max-width:40ch}

  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(12px,3vw,26px);width:100%;max-width:1000px}
  .tile>div{text-align:center}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;text-decoration:none;color:var(--bk-ink);
    background:#fff;border-radius:28px;box-shadow:0 8px 0 #e3d9b5,var(--bk-shadow);padding:clamp(18px,4vh,36px) 18px;
    min-height:clamp(180px,32vh,300px);border:3px solid transparent;transition:transform .12s;-webkit-tap-highlight-color:transparent}
  .tile:active{transform:translateY(5px);box-shadow:0 3px 0 #e3d9b5}
  .tile__icon{font-size:clamp(3rem,9vw,5.2rem);line-height:1}
  .tile__t{font-family:var(--f-head);font-size:clamp(1.4rem,4.2vw,2.2rem)}
  .tile__d{font-size:clamp(.82rem,2.2vw,1rem);color:var(--bk-ink-soft);text-align:center;margin:0}
  .tile--game{border-color:var(--bk-orange)}
  .tile--game .tile__t{color:var(--bk-orange-deep)}
  .tile--book{border-color:var(--bk-sky)}
  .tile--book .tile__t{color:#2f8dbf}
  .tile--ch{border-color:var(--bk-red)}
  .tile--ch .tile__t{color:#c93f2e}

  /* 🎓 조교와의 대결: 타일 아래 얇은 한 줄 */
  .strip{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:1000px;min-height:52px;box-sizing:border-box;padding:8px 18px;
    text-decoration:none;color:var(--bk-ink);background:#fff;border:3px solid var(--bk-purple);border-radius:999px;box-shadow:0 5px 0 #7a4fc0,var(--bk-shadow);
    transition:transform .12s;-webkit-tap-highlight-color:transparent}
  .strip:active{transform:translateY(4px);box-shadow:0 1px 0 #7a4fc0}
  .strip__i{font-size:1.5rem;line-height:1;flex:none}
  .strip__tx{display:flex;align-items:baseline;gap:8px;min-width:0}
  .strip__t{font-family:var(--f-head);font-size:clamp(1.1rem,3vw,1.45rem);color:#6a3fb0;white-space:nowrap;flex:none}
  .strip__d{font-size:clamp(.8rem,2.2vw,1rem);color:var(--bk-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .strip__go{font-family:var(--f-head);font-size:1.2rem;color:#6a3fb0;flex:none}

  .home footer{font-size:.78rem;color:var(--bk-ink-soft);text-align:center}
  /* 폰 세로: 위아래로 */
  @media(max-width:560px){
    .tiles{grid-template-columns:1fr}
    .tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:0;padding:18px 20px;gap:16px}
    .tile__icon{font-size:2.8rem}
    .tile__d{text-align:left}.tile>div{text-align:left}
    .home > p,.tile__d:not(.tile__d--games){display:none}
    .tile{padding:16px 14px;gap:12px}.tile>div{min-width:0}
    .home .tile__d--games{font-size:clamp(.62rem,3.6vw,.85rem);white-space:nowrap;letter-spacing:-.3px}
    .strip{justify-content:flex-start;padding:7px 14px 7px 18px;gap:12px;min-height:56px;border-radius:28px}
    .strip__i{font-size:2rem}
    .strip__tx{flex:1;flex-direction:column;align-items:flex-start;gap:0;line-height:1.25}
    .strip__dash{display:none}
  }
  /* 낮은 화면(크롬북 가로 등) */
  @media(max-height:560px) and (min-width:561px){
    .home{gap:10px}.home > p{display:none}.tile{min-height:130px;gap:6px;padding:12px 14px}.tile__icon{font-size:2.4rem}
    .home h1{font-size:clamp(1.4rem,4vw,2.2rem)}.home h1 br{display:none}
    .strip{min-height:44px;padding:4px 16px}
  }
  /* 크롬북(1366×700 안팎): 타일 아래 한 줄이 더 들어가도록 조금씩 줄임 */
  @media(max-height:780px) and (min-height:561px) and (min-width:561px){
    .home{gap:clamp(10px,2vh,16px)}.home h1{font-size:clamp(1.9rem,5vw,3.1rem)}
    .tile{padding:14px 16px;gap:6px;min-height:0}.tile__icon{font-size:clamp(3rem,7vw,4rem)}
  }
  /* 낮은 폰 화면(카카오톡·네이버 안에서 열 때 등): 작게 줄이고, 그래도 넘치면 스크롤 */
  @media(max-height:620px) and (max-width:560px){
    .home{gap:8px}.home h1{font-size:1.45rem}.home__eyebrow{padding:4px 12px;font-size:.85rem}
    .tile{padding:10px 14px;gap:10px}.tile__icon{font-size:2.1rem}.tile__t{font-size:1.25rem}
    .strip{min-height:46px;padding:4px 14px 4px 18px}.strip__i{font-size:1.6rem}.strip__d{font-size:.74rem}
  }
  /* 가운데 정렬하되 넘칠 때 위가 잘리지 않게 */
  .home{justify-content:flex-start}
  .home > :first-child{margin-top:auto}
  .home > :last-child{margin-bottom:auto}
</style>
</head>
<body class="bk">
<main class="home">
  <span class="home__eyebrow">🎪 수학 축전 · <span id="school">온천중학교</span> 부스</span>
  <h1>책 속 게임을 <em>직접 해 보는</em><br>부산의 활동수학</h1>
  <p>『부산의 활동수학』의 놀이와 필승 전략 게임을 웹으로 옮겼어요.</p>

  <div class="tiles">
    <a class="tile tile--game" href="games/arcade/index.html">
      <span class="tile__icon">🎮</span>
      <div>
        <div class="tile__t">메인 게임하기</div>
        <p class="tile__d tile__d--games" style="white-space:nowrap">노탁토 · 돌 가져가기 · 황금비 퀸 · 팝잇</p>
        <p class="tile__d">친구와 · 봇과 · 온라인으로</p>
      </div>
    </a>
    <a class="tile tile--ch" href="challenge/index.html">
      <span class="tile__icon">🏆</span>
      <div>
        <div class="tile__t">도전 모드</div>
        <p class="tile__d tile__d--games">7개 미션 · 도장 5개면 상품!</p>
        <p class="tile__d">AI를 이기고 도장을 모아요</p>
      </div>
    </a>
    <a class="tile tile--book" href="book/index.html">
      <span class="tile__icon">📖</span>
      <div>
        <div class="tile__t">책 목차 보기</div>
        <p class="tile__d">4단원 17장의 활동을<br>웹에서 바로 해 보기</p>
      </div>
    </a>
  </div>

  <a class="strip" href="ta/index.html">
    <span class="strip__i">🎓</span>
    <span class="strip__tx"><span class="strip__t">조교와의 대결</span><span class="strip__d"><span class="strip__dash">— </span>온라인으로 조교에게 도전!</span></span>
    <span class="strip__go" aria-hidden="true">›</span>
  </a>

  <footer>부산의 활동수학 × 수학 축전 부스 · <a href="qr.html" style="color:var(--bk-ink-soft)">🖥 부스 대기 화면(QR)</a> · <a href="monty/index.html" style="color:var(--bk-ink-soft)">🚪 몬티홀 상황판</a></footer>
</main>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
